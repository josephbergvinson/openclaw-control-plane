      - name: Preserve focused reliability outcomes
        if: always() && steps.focused-reliability.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reference-focused-reliability-${{ github.sha }}
          path: |
            ${{ runner.temp }}/reference-build-source.txt
            ${{ runner.temp }}/reference-focused-reliability.log
          if-no-files-found: error
          retention-days: 7
      - name: Install required Playwright Chromium
        working-directory: ${{ runner.temp }}/openclaw-reference
        run: node --import ./scripts/tsx.mjs scripts/ensure-playwright-chromium.mts --require-playwright-chromium
      - name: Pre-warm Chrome MCP
        working-directory: ${{ runner.temp }}/openclaw-reference
        run: npx -y --audit=false chrome-devtools-mcp@1.8.0 --version
      - name: Configure offline Chrome MCP
        working-directory: ${{ runner.temp }}/openclaw-reference
        run: npm config set cache="$HOME/.npm" offline=true --location=project
      # Native sequential compaction, shared child admission and signed Bun
      # replace the old parallel-compaction/process/Koffi implementations.
