name: Verify reference

on:
  push:
    branches: [main, "docs/current-build-reference-*"]
  pull_request:
  workflow_dispatch:
    inputs:
      expected_source_commit:
        description: Reviewed canonical runtime commit; rejects a coherently stale package
        required: false
        type: string
      expected_distribution_commit:
        description: Reviewed native distribution commit
        required: false
        type: string
      expected_companion_commit:
        description: Reviewed separately reconstructable macOS companion commit
        required: false
        type: string

permissions:
  contents: read

jobs:
  reference-checks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Read the runtime manifest
        id: runtime
        run: python3 scripts/runtime_ci_config.py >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.runtime.outputs.node }}
      - name: Check documentation and examples
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
          EXPECTED_DISTRIBUTION_COMMIT: ${{ inputs.expected_distribution_commit }}
          EXPECTED_COMPANION_COMMIT: ${{ inputs.expected_companion_commit }}
        run: |
          expected=()
          if [ -n "$EXPECTED_SOURCE_COMMIT" ]; then
            expected+=(--expected-source-commit "$EXPECTED_SOURCE_COMMIT")
          fi
          if [ -n "$EXPECTED_DISTRIBUTION_COMMIT" ]; then
            expected+=(--expected-distribution-commit "$EXPECTED_DISTRIBUTION_COMMIT")
          fi
          if [ -n "$EXPECTED_COMPANION_COMMIT" ]; then
            expected+=(--expected-companion-commit "$EXPECTED_COMPANION_COMMIT")
          fi
          python3 -B scripts/validate_repo.py "${expected[@]}"
      - name: Test reconstruction and workspace installers
        run: python3 -B -m unittest discover -s tests -p 'test_*.py'
      - name: Verify optional companion source reconstruction
        env:
          COMPANION_CHECKOUT: ${{ runner.temp }}/openclaw-companion-reference
        run: |
          has_companion=$(python3 -c 'import json; from scripts.validate_repo import companion_uses_native_source; m=json.load(open("runtime/manifest.json")); print(int("delta" in (m.get("nativeCompanion") or {}) or companion_uses_native_source(m)))')
          if [ "$has_companion" = 1 ]; then
            git clone --depth 1 --branch "${{ steps.runtime.outputs.tag }}" "${{ steps.runtime.outputs.repository }}" "$COMPANION_CHECKOUT"
            python3 -B scripts/reconstruct_runtime.py "$COMPANION_CHECKOUT" --apply --native-distribution --native-companion
          fi
      - name: Test exported workspace behavior in its confined fixtures
        run: |
          python3 -m venv "$RUNNER_TEMP/reference-workspace-tests"
          "$RUNNER_TEMP/reference-workspace-tests/bin/python" -m pip install \
            -r workspace/dependencies/requirements.txt pytest
          "$RUNNER_TEMP/reference-workspace-tests/bin/python" workspace/tests/run_periphery_tests.py
      - name: Test native plan preservation with fake command execution
        run: node --test tests/native-reference-checks.test.mjs
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD

  runtime-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the runtime manifest
        id: runtime
        run: python3 scripts/runtime_ci_config.py >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.runtime.outputs.node }}
      - name: Install the pinned package manager
        run: npm install --global "pnpm@${{ steps.runtime.outputs.pnpm }}"
      - name: Reconstruct the pinned source in a separate checkout
        env:
          RUNTIME_CHECKOUT: ${{ runner.temp }}/openclaw-reference
        run: |
          git clone --depth 1 --branch "${{ steps.runtime.outputs.tag }}" "${{ steps.runtime.outputs.repository }}" "$RUNTIME_CHECKOUT"
          python3 scripts/reconstruct_runtime.py "$RUNTIME_CHECKOUT" --apply
          git -C "$RUNTIME_CHECKOUT" -c user.name='Reference verification' -c user.email='reference-verification@users.noreply.github.com' -c core.hooksPath=/dev/null commit -m 'Reconstruct the reference runtime'
      - name: Admit native workflow targets against the reconstructed source
        env:
          RUNTIME_CHECKOUT: ${{ runner.temp }}/openclaw-reference
        run: python3 -B scripts/validate_runtime_targets.py "$RUNTIME_CHECKOUT" --workflow .github/workflows/verify-reference.yml
      - name: Install frozen runtime dependencies
        working-directory: ${{ runner.temp }}/openclaw-reference
        run: pnpm install --frozen-lockfile
      - name: Install ripgrep for native ratchets
        uses: openclaw/openclaw/.github/actions/setup-ripgrep@383c124cc32ffee3f8e56f549b88da94d269a4af

      - name: Run the complete native plan with split core lint
        id: native
        working-directory: ${{ runner.temp }}/openclaw-reference
        run: |
          set -o pipefail
          node --import ./scripts/tsx.mjs "$GITHUB_WORKSPACE/scripts/run-native-reference-checks.mjs" "$GITHUB_WORKSPACE/runtime/manifest.json" "$RUNNER_TEMP/reference-native-evidence" 2>&1 | tee "$RUNNER_TEMP/reference-native.log"
      - name: Preserve native command plan and actual outcomes
        if: always() && steps.native.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reference-native-${{ github.sha }}
          path: |
            ${{ runner.temp }}/reference-native-evidence
            ${{ runner.temp }}/reference-native.log
          if-no-files-found: error
          retention-days: 7

  runtime-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the runtime manifest
        id: runtime
        run: python3 scripts/runtime_ci_config.py >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.runtime.outputs.node }}
      - name: Install the pinned package manager
        run: npm install --global "pnpm@${{ steps.runtime.outputs.pnpm }}"
      - name: Reconstruct the pinned source in a separate checkout
        env:
          RUNTIME_CHECKOUT: ${{ runner.temp }}/openclaw-reference
        run: |
          git clone --depth 1 --branch "${{ steps.runtime.outputs.tag }}" "${{ steps.runtime.outputs.repository }}" "$RUNTIME_CHECKOUT"
          python3 scripts/reconstruct_runtime.py "$RUNTIME_CHECKOUT" --apply
          git -C "$RUNTIME_CHECKOUT" -c user.name='Reference verification' -c user.email='reference-verification@users.noreply.github.com' -c core.hooksPath=/dev/null commit -m 'Reconstruct the reference runtime'
      - name: Admit native workflow targets against the reconstructed source
        env:
          RUNTIME_CHECKOUT: ${{ runner.temp }}/openclaw-reference
        run: python3 -B scripts/validate_runtime_targets.py "$RUNTIME_CHECKOUT" --workflow .github/workflows/verify-reference.yml
      - name: Install frozen runtime dependencies
        working-directory: ${{ runner.temp }}/openclaw-reference
        run: pnpm install --frozen-lockfile
      - name: Build the reconstructed runtime
        id: build
        working-directory: ${{ runner.temp }}/openclaw-reference
        run: |
          set -o pipefail
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/reference-build-source.txt"
          pnpm build 2>&1 | tee "$RUNNER_TEMP/reference-build.log"
      - name: Verify overlapping requester-final delivery
        id: requester-final-overlap
        working-directory: ${{ runner.temp }}/openclaw-reference
        run: |
          set -o pipefail
          node scripts/run-vitest.mjs run \
            --config \
            test/vitest/vitest.agents-support.config.ts \
            src/agents/subagents/requester-final-attachment.test.ts \
            src/agents/subagents/announce/subagent-announce.requester-settle-wake.test.ts \
            src/agents/subagents/announce/subagent-announce.requester-settle-ownership.test.ts \
            2>&1 | tee "$RUNNER_TEMP/reference-requester-final-overlap.log"
      - name: Verify Discord voice yield and guild policy
        id: discord-voice-yield-policy
        working-directory: ${{ runner.temp }}/openclaw-reference
        run: |
          set -o pipefail
          node scripts/run-vitest.mjs run \
            --config \
            test/vitest/vitest.extension-discord.config.ts \
            extensions/discord/src/config-schema.test.ts \
            extensions/discord/src/voice/guild-voice-policy.test.ts \
            extensions/discord/src/voice/realtime-consults.yielded.test.ts \
            extensions/discord/src/voice/ingress.test.ts \
            extensions/discord/src/voice/agent-control.test.ts \
            extensions/discord/src/voice/access.test.ts \
            extensions/discord/src/voice/segment.test.ts \
            extensions/discord/src/voice/realtime-consults.test.ts \
            extensions/discord/src/voice/voice-session.promotion.test.ts \
            extensions/discord/src/voice/voice-receive.test.ts \
            extensions/discord/src/voice/realtime-listening.test.ts \
            extensions/discord/src/voice/realtime-speaker-context.test.ts \
            extensions/discord/src/voice/voice-conversation-input.test.ts \
            extensions/discord/src/voice/voice-session.startup.test.ts \
            extensions/discord/src/voice/realtime-turns.test.ts \
            extensions/discord/src/voice/transcripts-conversation.test.ts \
            extensions/discord/src/voice/transcripts-realtime-recording.test.ts \
            extensions/discord/src/voice/realtime-consults.host-cancellation.test.ts \
            extensions/discord/src/voice/realtime-playback.test.ts \
            extensions/discord/src/voice/realtime-speaker-sessions.test.ts \
            extensions/discord/src/voice/realtime-voice-selection.test.ts \
            extensions/discord/src/voice/voice-session.lifecycle.test.ts \
            extensions/discord/src/voice/follow-recording.test.ts \
            extensions/discord/src/voice/transcripts-capture.test.ts \
            2>&1 | tee "$RUNNER_TEMP/reference-discord-voice-yield-policy.log"
      - name: Verify voice execution identity and final ownership
        id: voice-execution-identity
        working-directory: ${{ runner.temp }}/openclaw-reference
        run: |
          set -o pipefail
          node scripts/run-vitest.mjs run \
