name: Verify reference

on:
  push:
    branches: [main, "docs/current-build-reference-*"]
    paths-ignore:
      - runtime/diagnostics/**
      - .github/workflows/steering-regression.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Read the runtime manifest
        id: runtime
        run: python3 scripts/runtime_ci_config.py >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.runtime.outputs.node }}
      - name: Check documentation and examples
        run: python3 -B scripts/validate_repo.py
      - name: Test reconstruction and workspace installers
        run: python3 -B -m unittest discover -s tests -p 'test_*.py'
      - name: Test native plan preservation with fake command execution
        run: node --test tests/native-reference-checks.test.mjs
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD

  runtime-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the runtime manifest
        id: runtime
        run: python3 scripts/runtime_ci_config.py >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.runtime.outputs.node }}
      - name: Install the pinned package manager
        run: npm install --global "pnpm@${{ steps.runtime.outputs.pnpm }}"
      - name: Reconstruct the pinned source in a separate checkout
        env:
          RUNTIME_CHECKOUT: ${{ runner.temp }}/openclaw-reference
        run: |
          git clone --depth 1 --branch "${{ steps.runtime.outputs.tag }}" "${{ steps.runtime.outputs.repository }}" "$RUNTIME_CHECKOUT"
          python3 scripts/reconstruct_runtime.py "$RUNTIME_CHECKOUT" --apply
          git -C "$RUNTIME_CHECKOUT" -c user.name='Reference verification' -c user.email='reference-verification@users.noreply.github.com' -c core.hooksPath=/dev/null commit -m 'Reconstruct the reference runtime'
      - name: Install frozen runtime dependencies
        working-directory: ${{ runner.temp }}/openclaw-reference
        run: pnpm install --frozen-lockfile
      - name: Run the complete native plan with split core lint
        id: native
        working-directory: ${{ runner.temp }}/openclaw-reference
        run: |
          set -o pipefail
          node --import ./scripts/tsx.mjs "$GITHUB_WORKSPACE/scripts/run-native-reference-checks.mjs" "$GITHUB_WORKSPACE/runtime/manifest.json" "$RUNNER_TEMP/reference-native-evidence" 2>&1 | tee "$RUNNER_TEMP/reference-native.log"
      - name: Preserve native command plan and actual outcomes
        if: always() && steps.native.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reference-native-${{ github.sha }}
          path: |
            ${{ runner.temp }}/reference-native-evidence
            ${{ runner.temp }}/reference-native.log
          if-no-files-found: error
          retention-days: 7

  runtime-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the runtime manifest
        id: runtime
        run: python3 scripts/runtime_ci_config.py >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.runtime.outputs.node }}
      - name: Install the pinned package manager
        run: npm install --global "pnpm@${{ steps.runtime.outputs.pnpm }}"
      - name: Reconstruct the pinned source in a separate checkout
        env:
          RUNTIME_CHECKOUT: ${{ runner.temp }}/openclaw-reference
        run: |
          git clone --depth 1 --branch "${{ steps.runtime.outputs.tag }}" "${{ steps.runtime.outputs.repository }}" "$RUNTIME_CHECKOUT"
          python3 scripts/reconstruct_runtime.py "$RUNTIME_CHECKOUT" --apply
          git -C "$RUNTIME_CHECKOUT" -c user.name='Reference verification' -c user.email='reference-verification@users.noreply.github.com' -c core.hooksPath=/dev/null commit -m 'Reconstruct the reference runtime'
      - name: Install frozen runtime dependencies
        working-directory: ${{ runner.temp }}/openclaw-reference
        run: pnpm install --frozen-lockfile
      - name: Build the reconstructed runtime
        id: build
        working-directory: ${{ runner.temp }}/openclaw-reference
        run: |
          set -o pipefail
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/reference-build-source.txt"
          pnpm build 2>&1 | tee "$RUNNER_TEMP/reference-build.log"
      - name: Verify focused progress, steering and workspace read regressions
        id: focused-reliability
        working-directory: ${{ runner.temp }}/openclaw-reference
        run: |
          set -o pipefail
          node scripts/run-vitest.mjs \
            src/tasks/task-registry-progress.test.ts \
            src/agents/openclaw-tools.sessions.test.ts \
            src/agents/openclaw-tools.sessions-steering.test.ts \
            src/agents/openclaw-tools.web-fetch-workspace.test.ts \
            src/agents/tools/web-fetch-output-contract.test.ts \
            src/agents/sessions/tools/output-accumulator.test.ts \
            2>&1 | tee "$RUNNER_TEMP/reference-focused-reliability.log"
      - name: Preserve focused reliability outcomes
        if: always() && steps.focused-reliability.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reference-focused-reliability-${{ github.sha }}
          path: |
            ${{ runner.temp }}/reference-build-source.txt
            ${{ runner.temp }}/reference-focused-reliability.log
          if-no-files-found: error
          retention-days: 7
      - name: Run owned follow-up and yield regressions
