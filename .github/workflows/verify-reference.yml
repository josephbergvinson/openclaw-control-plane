            extensions/discord/src/monitor/message-handler.draft-preview.rest.test.ts \
            extensions/discord/src/monitor/message-handler.draft-preview.checkpoint.test.ts \
            extensions/discord/src/monitor/message-handler.draft-preview.visibility.test.ts \
            extensions/discord/src/monitor/dm-command-auth.test.ts \
            extensions/discord/src/monitor/message-handler.preflight-context.test.ts \
            extensions/discord/src/monitor/message-handler.preflight.test.ts \
            extensions/discord/src/monitor/message-handler.process.session-routing.test.ts \
            2>&1 | tee "$RUNNER_TEMP/reference-cadence-discord.log"
      - name: Preserve resumed requester progress evidence
        if: always() && steps.cadence.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reference-cadence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/reference-build-source.txt
            ${{ runner.temp }}/reference-cadence-agents.log
            ${{ runner.temp }}/reference-cadence-discord.log
          if-no-files-found: error
          retention-days: 7
      - name: Verify embedded follow-up completion receipts
        id: receipts
        working-directory: ${{ runner.temp }}/openclaw-reference
        run: |
          set -o pipefail
          pnpm test:serial src/agents/embedded-agent-subscribe.handlers.tools.test.ts \
            --testNamePattern 'tracks only owned follow-up sends for requester settlement \(owned=(true|false)\)' \
            2>&1 | tee "$RUNNER_TEMP/reference-followup-receipts.log"
      - name: Verify requester continuation and steering after follow-up
        id: continuation
        working-directory: ${{ runner.temp }}/openclaw-reference
        env:
          OPENCLAW_E2E_USE_PREBUILT_DIST: "1"
          OPENCLAW_E2E_WORKERS: "1"
        run: |
          set -o pipefail
          node scripts/run-vitest.mjs run \
            src/agents/subagents/registry/subagent-registry.requester-wake.e2e.test.ts \
            src/auto-reply/reply/agent-runner.runreplyagent.e2e.test.ts \
            2>&1 | tee "$RUNNER_TEMP/reference-followup-continuation.log"
      - name: Preserve follow-up qualification evidence
        if: always() && steps.followup.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reference-followup-${{ github.sha }}
          path: |
            ${{ runner.temp }}/reference-build-source.txt
            ${{ runner.temp }}/reference-followup-unit.log
            ${{ runner.temp }}/reference-qa-authority-gateway.log
            ${{ runner.temp }}/reference-qa-authority-auto-reply.log
            ${{ runner.temp }}/reference-mcp-discovery.log
            ${{ runner.temp }}/reference-credential-continuity.log
            ${{ runner.temp }}/reference-completion-checkpoint.log
            ${{ runner.temp }}/reference-followup-terminal.log
            ${{ runner.temp }}/reference-followup-receipts.log
            ${{ runner.temp }}/reference-followup-continuation.log
          if-no-files-found: error
          retention-days: 7
      - name: Preserve actual build output
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reference-build-${{ github.sha }}
          path: |
            ${{ runner.temp }}/reference-build-source.txt
            ${{ runner.temp }}/reference-build.log
          if-no-files-found: error
          retention-days: 7

  reconstruct-and-build:
    needs: [reference-checks, runtime-checks, runtime-build]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every qualification job to succeed
        env:
          REFERENCE_RESULT: ${{ needs.reference-checks.result }}
          NATIVE_RESULT: ${{ needs.runtime-checks.result }}
          BUILD_RESULT: ${{ needs.runtime-build.result }}
        run: |
          test "$REFERENCE_RESULT" = success
          test "$NATIVE_RESULT" = success
          test "$BUILD_RESULT" = success
