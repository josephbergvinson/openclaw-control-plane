    runs-on: ubuntu-24.04
    steps:
      - name: Require every qualification job to succeed
        env:
          REFERENCE_RESULT: ${{ needs.reference-checks.result }}
          NATIVE_RESULT: ${{ needs.runtime-checks.result }}
          BUILD_RESULT: ${{ needs.runtime-build.result }}
        run: |
          test "$REFERENCE_RESULT" = success
          test "$NATIVE_RESULT" = success
          test "$BUILD_RESULT" = success
