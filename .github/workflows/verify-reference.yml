            src/agents/subagents/registry/subagent-progress-checkpoint.test.ts \
            src/agents/subagents/announce/subagent-announce.requester-settle-dispatch.test.ts \
            2>&1 | tee "$RUNNER_TEMP/reference-discord-own-channel-route.log"
      - name: Verify frozen npm lock override contexts
        id: npm-override-contexts
        working-directory: ${{ runner.temp }}/openclaw-reference
        run: |
          set -o pipefail
          node scripts/run-vitest.mjs run test/scripts/generate-npm-package-lock.test.ts \
            2>&1 | tee "$RUNNER_TEMP/reference-npm-override-contexts.log"
      - name: Verify focused progress, steering and workspace read regressions
        id: focused-reliability
        working-directory: ${{ runner.temp }}/openclaw-reference
        run: |
          set -o pipefail
          node scripts/run-vitest.mjs \
