name: Steering regression

on:
  push:
    branches: [main, "docs/current-build-reference-*"]
    paths:
      - runtime/**
      - scripts/reconstruct_runtime.py
      - .github/workflows/steering-regression.yml
  pull_request:
    paths:
      - runtime/**
      - scripts/reconstruct_runtime.py
      - .github/workflows/steering-regression.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adopted-source-steering:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
      - name: Install the pinned package manager
        run: npm install --global pnpm@12.3.4
      - name: Reconstruct the pinned runtime source
        env:
          RUNTIME_CHECKOUT: ${{ runner.temp }}/openclaw-steering
        run: |
          git clone --depth 1 --branch v2026.9.3 https://github.com/openclaw/openclaw.git "$RUNTIME_CHECKOUT"
          python3 scripts/reconstruct_runtime.py "$RUNTIME_CHECKOUT" --apply
      - name: Install frozen runtime dependencies
        working-directory: ${{ runner.temp }}/openclaw-steering
        run: pnpm install --frozen-lockfile
      - name: Install the isolated regression fixture
        env:
          RUNTIME_CHECKOUT: ${{ runner.temp }}/openclaw-steering
        run: cp -R runtime/diagnostics/adopted-steering/test/isolated-queue "$RUNTIME_CHECKOUT/test/isolated-queue"
      - name: Run all ten steering cases against the reconstructed runtime
        id: steering
        working-directory: ${{ runner.temp }}/openclaw-steering
        env:
          OPENCLAW_VITEST_MAX_WORKERS: "1"
          OPENCLAW_VITEST_IMPORT_DURATIONS: "1"
          DEBUG: vite:load,vite:transform
        run: |
          set +e
          node scripts/run-vitest.mjs run --pool=forks --config test/isolated-queue/vitest.queue-candidate.config.ts test/isolated-queue/adopted-drain-steering.unit-dormant-boundary.test.ts test/isolated-queue/adopted-drain-steering.owner-fifo.test.ts --reporter=verbose --reporter=junit --reporter="$PWD/scripts/lib/vitest-resource-reporter.mts" --outputFile.junit="$RUNNER_TEMP/steering-candidate.xml" 2>&1 | tee "$RUNNER_TEMP/steering-candidate.log"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${pipeline_status[0]}" > "$RUNNER_TEMP/steering-candidate.exit"
          printf 'Steering regression native exit: %s\n' "${pipeline_status[0]}"
          test "${pipeline_status[1]}" -eq 0
          python3 "$GITHUB_WORKSPACE/runtime/diagnostics/adopted-steering/verify_result.py" candidate "${pipeline_status[0]}" "$RUNNER_TEMP/steering-candidate.xml" "$RUNNER_TEMP/steering-candidate.log" "$RUNNER_TEMP/steering-candidate-verdict.json"
      - name: Remove only the verified untracked diagnostic copy
        working-directory: ${{ runner.temp }}/openclaw-steering
        run: python3 "$GITHUB_WORKSPACE/runtime/diagnostics/adopted-steering/freeze_candidate.py" remove-fixture "$PWD"
      - name: Run the focused native ownership and cron suites
        id: owners
        working-directory: ${{ runner.temp }}/openclaw-steering
        run: |
          set +e
          pnpm test:serial src/auto-reply/reply/followup-turn-admission.test.ts src/auto-reply/reply/agent-runner-steer-adoption.question-recovery.test.ts src/auto-reply/reply/get-reply-run.media-only.test.ts src/auto-reply/reply/get-reply-run.prepared-metadata.test.ts src/auto-reply/reply/queue/state.test.ts src/auto-reply/reply/queue.in-flight.test.ts src/auto-reply/reply/queue.collect.test.ts src/auto-reply/reply/queue.drain-restart.test.ts src/auto-reply/reply/queue/drain.identity-guard.test.ts src/auto-reply/reply/reply-run-registry.test.ts src/auto-reply/reply/reply-run-registry.control-owner.test.ts src/cron/command-runner.test.ts 2>&1 | tee "$RUNNER_TEMP/candidate-owner-tests.log"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${pipeline_status[0]}" > "$RUNNER_TEMP/candidate-owner-tests.exit"
          test "${pipeline_status[1]}" -eq 0
          exit "${pipeline_status[0]}"
      - name: Preserve the actual native result
        if: always() && steps.steering.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: steering-regression-${{ github.sha }}
          path: |
            ${{ runner.temp }}/steering-candidate.xml
            ${{ runner.temp }}/steering-candidate.log
            ${{ runner.temp }}/steering-candidate.exit
            ${{ runner.temp }}/steering-candidate-verdict.json
            ${{ runner.temp }}/candidate-owner-tests.log
            ${{ runner.temp }}/candidate-owner-tests.exit
          if-no-files-found: warn
          retention-days: 7
